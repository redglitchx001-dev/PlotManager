world_settings:
  protected_world: "world"
  wilderness_building: false
  wilderness_interact: true
  wilderness_crop_trample: false
  disable_explosions_everywhere: true
  disable_fire_everywhere: true
  disable_wither_everywhere: true
  disable_dragon_grief: true
  disable_enderman_pickup: true

maplink:
  enabled: true
  url: "http://map.yourserver.com"
  message: "&aView our live server map at: &2&n%url%"
  hover_text: "&aClick to open the map!"
  clickable: true

# ---------------------------------------------------------- #
# [2] CLAIMING & LIMITS                                      #
# ---------------------------------------------------------- #
claiming:
  max_plots_per_player_default: 3
  max_plots_per_player_vip: 10
  min_claim_size_blocks: 10
  max_claim_size_blocks: 250
  allow_claim_merging: true
  wand_item: "GOLDEN_AXE"
  wand_name: "&2&lPlot Wand"
  wand_lore:
    - "&aLeft-Click: Set Position 1"
    - "&aRight-Click: Set Position 2"
    - "&7Then type /plot claim"
  pos1_message: "&aPosition 1 set at &2(%x%, %y%, %z%)"
  pos2_message: "&aPosition 2 set at &2(%x%, %y%, %z%)"
  claim_success_message: "&aCongratulations! You claimed your plot for &2$%cost%&a!"
  claim_denied_message: "&cYou don't have enough money! Need: $%cost%"
  max_claims_message: "&cYou already have %owned%/%max% plots!"
  overlap_message: "&cThat selection overlaps an existing plot!"
  too_small_message: "&cYour selection is too small! Minimum: %min%x%min%"
  too_large_message: "&cYour selection is too large! Maximum: %max%x%max%"
  no_selection_message: "&cSet both positions with the Plot Wand first!"
  merge_success_message: "&aPlots merged successfully!"
  merge_fail_message: "&cYou need two adjacent owned plots to merge."
  unclaim_success_message: "&aPlot unclaimed. Refunded &2$%amount%&a."
  unclaim_confirm_message: "&cShift-click the TNT in /plot menu or type /plot unclaim confirm"

# ---------------------------------------------------------- #
# [3] MEMBER LIMITS                                          #
# ---------------------------------------------------------- #
members:
  max_members_default: 5
  max_members_vip: 10
  max_members_mvp: 25
  max_coowners: 2
  max_builders: 10
  member_add_message: "&a%player% has been added to your plot as %role%!"
  member_remove_message: "&c%player% has been removed from your plot."
  member_limit_message: "&cYou can only have %current%/%max% members!"
  promote_message: "&a%player% promoted to %role%!"
  demote_message: "&a%player% demoted to %role%!"

# ---------------------------------------------------------- #
# [4] PREMIUM PLOTS                                          #
# ---------------------------------------------------------- #
premium:
  enabled: true
  tiers:
    vip:
      luckperms_groups:
        - "vip"
        - "vip-plus"
        - "sponsor"
      display_name: "&a&lVIP"
      claim_cost: 5000.0
      max_plots: 5
      max_members: 10
      hopper_limit: 100
      spawner_limit: 20
    mvp:
      luckperms_groups:
        - "mvp"
        - "mvp-plus"
        - "titan"
        - "legend"
      display_name: "&b&lMVP"
      claim_cost: 10000.0
      max_plots: 10
      max_members: 25
      hopper_limit: 200
      spawner_limit: 50
    god:
      luckperms_groups:
        - "god"
        - "owner"
        - "admin"
      display_name: "&4&lGOD"
      claim_cost: 0.0
      max_plots: 100
      max_members: 100
      hopper_limit: 1000
      spawner_limit: 500

# ---------------------------------------------------------- #
# [5] DISCORD JDA INTEGRATION                                #
# ---------------------------------------------------------- #
discord:
  enabled: false
  bot_token: "YOUR_BOT_TOKEN_HERE"
  bot_status: "Watching %total_plots% plots"
  log_channel_id: "YOUR_LOG_CHANNEL_ID_HERE"
  chat_sync:
    enabled: true
    chat_channel_id: "YOUR_CHAT_CHANNEL_ID_HERE"
    minecraft_to_discord_format: "[MC] **%player%**: %message%"
    discord_to_minecraft_format: "&9[Discord] &f%user%&7: &f%message%"
  join_leave_channel_id: "YOUR_JOIN_LEAVE_CHANNEL_ID_HERE"
  join_message: ":green_circle: **%player%** joined the server!"
  leave_message: ":red_circle: **%player%** left the server."
  claim_log_message: ":house: **%player%** claimed a new plot at (%x%, %z%) for $%cost%"
  reset_log_message: ":recycle: Plot **%plot_id%** owned by **%owner%** has been reset to nature after %days% days."
  purge_log_message: ":broom: **Admin %admin%** purged %count% inactive plots."
  seize_log_message: ":police_car: **Admin %admin%** seized plot **%plot_id%** from **%owner%**."
  role_sync:
    enabled: true
    plot_lord_role_id: "YOUR_ROLE_ID_HERE"
    required_plot_level: 10

# ---------------------------------------------------------- #
# [6] FAWE & INACTIVITY NATURE RESET                         #
# ---------------------------------------------------------- #
reset_system:
  enabled: true
  inactivity_days: 7
  check_interval_minutes: 60
  paste_original_schematic: true
  send_discord_alert: true
  alert_message: "Plot %plot_id% owned by %owner% has been reset to nature after %days% days of inactivity."
  warning_days_before: 2
  warning_message: "&c&lWARNING: &cYour plot will be reset in %remaining% days due to inactivity!"

# ---------------------------------------------------------- #
# [7] ECONOMY & PRICING                                      #
# ---------------------------------------------------------- #
economy:
  claim_cost: 1000.0
  premium_claim_cost: 5000.0
  unclaim_refund_percent: 50
  tip_jar_minimum: 10.0
  tip_jar_message: "&a%player% tipped &2$%amount% &ato your plot!"
  deposit_message: "&aYou deposited &2$%amount% &ainto the plot bank. Balance: &2$%balance%"
  withdraw_message: "&aYou withdrew &2$%amount% &afrom the plot bank. Balance: &2$%balance%"
  not_enough_money_message: "&cNot enough money! You have: $%balance%"
  not_enough_bank_message: "&cThe plot bank does not have enough money!"

upkeep:
  enabled: true
  cost_per_cycle: 0
  cycle_hours: 168
  upkeep_warning_message: "&c&lUpkeep due! &cYour plot costs &4$%cost% &cevery %hours% hours."
  upkeep_paid_message: "&aUpkeep of &2$%cost% &ahas been automatically paid from your plot bank."
  upkeep_failed_message: "&c&lWARNING: &cUpkeep payment failed! Your plot may be deleted!"

upgrades:
  fly:
    enabled: true
    cost: 1500.0
    description: "Unlock flying inside your plot"
    purchase_message: "&aYou unlocked &2Plot Fly &afor &2$%cost%&a!"
  crop_boost:
    enabled: true
    cost: 2500.0
    multiplier: 2.0
    description: "Crops grow 2x faster in your plot"
    purchase_message: "&aYou unlocked &2Crop Boost (x%multiplier%) &afor &2$%cost%&a!"
  vault_page:
    cost_per_page: 500.0
    max_pages: 5
    purchase_message: "&aYou unlocked &2Vault Page %page% &afor &2$%cost%&a!"
  generator_tier_1:
    cost: 2000.0
    item: "IRON_INGOT"
    amount: 1
    interval_minutes: 10
    description: "Produces 1 Iron Ingot every 10 minutes"
    purchase_message: "&aYou bought an &2Iron Generator &afor &2$%cost%&a!"
  generator_tier_2:
    cost: 5000.0
    item: "GOLD_INGOT"
    amount: 1
    interval_minutes: 15
    description: "Produces 1 Gold Ingot every 15 minutes"
    purchase_message: "&aYou bought a &6Gold Generator &afor &2$%cost%&a!"
  generator_tier_3:
    cost: 15000.0
    item: "DIAMOND"
    amount: 1
    interval_minutes: 30
    description: "Produces 1 Diamond every 30 minutes"
    purchase_message: "&aYou bought a &bDiamond Generator &afor &2$%cost%&a!"
  music:
    cost: 200.0
    description: "Unlock music in your plot"
    purchase_message: "&aYou unlocked &2Plot Music &afor &2$%cost%&a!"
  smart_sorter:
    cost: 3500.0
    description: "Unlock Smart Hoppers that auto-sort by item frames"
    purchase_message: "&aYou unlocked &2Smart Sorters &afor &2$%cost%&a!"
  factory:
    cost: 4000.0
    description: "Chest shops auto-restock from the Plot Vault"
    purchase_message: "&aYou unlocked &2Plot Factories &afor &2$%cost%&a!"

# ---------------------------------------------------------- #
# [8] AUTO-HOLOGRAM (SPAWNS WHEN YOU CLAIM)                  #
# ---------------------------------------------------------- #

  enabled: true
  spawn_on_claim: true
  height_above_center: 3.0
  line_spacing: 0.28
  update_ticks: 40
  view_distance_blocks: 48
  invisible_armorstand: true
  glow_effect: false
  animation:
    enabled: true
    type: "FLOAT"
    speed: 0.02
  lines_occupied:
    - "&2&l━━━━━━━━━━━━━━━━━"
    - "&c&lOCCUPIED"
    - ""
    - "&2&l%plot_name%"
    - "&aOwner: &f%plotmanager_current_plot_owner%"
    - "&aLevel: &f%plotmanager_current_plot_level% &8| &aEXP: &f%plotmanager_current_plot_exp%"
    - "&aBank: &f$%plotmanager_current_plot_bank%"
    - "&aMembers: &f%plotmanager_current_plot_members%/%plotmanager_current_plot_members_max%"
    - "&aGenerators: &f%plotmanager_current_plot_generators%"
    - "&aSince: &f%plotmanager_current_plot_created%"
    - ""
    - "&7%plotmanager_current_plot_description%"
    - "&2&l━━━━━━━━━━━━━━━━━"
  lines_premium_vip:
    - "&e&l⭐ ━━━━━━━━━━━━━ ⭐"
    - "&6&lVIP PLOT"
    - ""
    - "&e&l%plot_name%"
    - "&6Owner: &f%plotmanager_current_plot_owner%"
    - "&6Level: &f%plotmanager_current_plot_level%"
    - "&6Members: &f%plotmanager_current_plot_members%/%plotmanager_current_plot_members_max%"
    - "&e&l⭐ ━━━━━━━━━━━━━ ⭐"
  lines_premium_mvp:
    - "&b&l💎 ━━━━━━━━━━━━━ 💎"
    - "&3&lMVP PLOT"
    - ""
    - "&b&l%plot_name%"
    - "&3Owner: &f%plotmanager_current_plot_owner%"
    - "&3Level: &f%plotmanager_current_plot_level%"
    - "&3Members: &f%plotmanager_current_plot_members%/%plotmanager_current_plot_members_max%"
    - "&b&l💎 ━━━━━━━━━━━━━ 💎"
  lines_free:
    - "&2&l━━━━━━━━━━━━━━━━━"
    - "&a&l✦ FREE PLOT ✦"
    - ""
    - "&7This plot is available!"
    - "&aPrice: &f$%claim_cost%"
    - "&aSize: &f%size_x%x%size_z% blocks"
    - ""
    - "&7Use &a/plot claim &7to buy"
    - "&2&l━━━━━━━━━━━━━━━━━"

# ---------------------------------------------------------- #
# [9] CUSTOM HOLOGRAMS (FANCYHOLOGRAMS STYLE)                #
# ---------------------------------------------------------- #
holograms:
  enabled: true
  max_holograms_per_plot: 2
  cost_per_hologram: 500.0
  cost_per_extra_line: 50.0
  max_lines_per_hologram: 10
  profanity_filter: true
  profanity_replacement: "***"
  update_ticks: 60
  default_lines_on_create:
    - "&2&lMy Hologram"
    - "&aEdit me with /plot holo addline"
  banned_words:
    - "nigga"
    - "nigger"
    - "faggot"
    - "retard"
    - "fuck"
    - "shit"
    - "dick"
    - "pussy"
    - "bitch"
    - "ass"
    - "cunt"
  profanity_blocked_message: "&cYour hologram text contains a banned word!"
  hologram_created_message: "&aHologram created! Cost: &2$%cost%"
  hologram_deleted_message: "&aHologram deleted."
  hologram_moved_message: "&aMain hologram moved to your location."
  line_added_message: "&aLine added to hologram: &f%text%"
  line_removed_message: "&aLine %number% removed from hologram."
  max_holograms_message: "&cYou already have %current%/%max% holograms!"

# ---------------------------------------------------------- #
# [10] BLUE MAP WEB INTEGRATION                              #
# ---------------------------------------------------------- #
bluemap:
  enabled: true
  border_color: "#00FF00"
  border_color_premium: "#FFD700"
  border_color_frozen: "#FF0000"
  border_opacity: 0.7
  border_thickness: 3
  show_owner_name: true
  show_plot_level: true
  show_bank_balance: true
  show_member_count: true
  label_format: "Plot: %plot_name% | Owner: %owner% | Lvl: %level% | Members: %members%/%max_members%"

# ---------------------------------------------------------- #
# [11] PLOT LEVELING (EXP SYSTEM)                            #
# ---------------------------------------------------------- #
leveling:
  enabled: true
  exp_per_visitor_minute: 5
  exp_per_tip_dollar: 1
  exp_per_shop_sale: 10
  exp_per_block_placed: 0
  max_level: 100
  level_up_message: "&2&l⬆ LEVEL UP! &aYour plot is now &2Level %level%&a!"
  level_up_sound: "ENTITY_PLAYER_LEVELUP"
  particles_unlocked_at_level: 5
  generator_tier2_unlocked_at_level: 10
  generator_tier3_unlocked_at_level: 25
  fly_unlocked_at_level: 15
  exp_formula: "level * 100"


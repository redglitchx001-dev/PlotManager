name: PlotManager
version: '${project.version}'
main: com.redglitchx.plotmanager.PlotManager
api-version: '1.21'
description: The Ultimate Plot Management System V1 | (c) RedGlitchX - All Rights Reserved
authors: [RedGlitchX]
website: https://github.com/redglitchx001-dev/PlotManager
# Vault is only needed for money features. It is listed as a soft dependency on
# purpose: PlotManager must still load (with the economy switched off) when Vault
# or its economy provider is missing, instead of refusing to enable.
# Everything below is optional - run /plot hooks in game to see what is detected.
softdepend: [Vault, Essentials, EssentialsX, CMI, PlaceholderAPI, ProtocolLib, WorldGuard, WorldEdit, FastAsyncWorldEdit, BlueMap, LuckPerms, SimpleVoiceChat, voicechat]
commands:
  plot:
    description: PlotManager main command
    aliases: [p, plots]
    usage: /plot <subcommand>
permissions:
  plotmanager.use:
    description: Basic plot usage
    default: true
  plotmanager.claim:
    description: Claim plots
    default: true
  plotmanager.premium.claim:
    description: Claim premium plots
    default: op
  plotmanager.wand:
    description: Use the plot selection wand
    default: op
  plotmanager.admin:
    description: Full admin access
    default: op
  plotmanager.bypass:
    description: Bypass plot protection
    default: op
  plotmanager.drone:
    description: Use drone camera mode
    default: true
  plotmanager.blackmarket:
    description: Access the blackmarket
    default: true
  plotmanager.mayor:
    description: Mayor tax powers (also granted dynamically to #1 plot)
    default: op
